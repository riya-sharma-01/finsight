<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Expense Tracker 💫</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- WELCOME MODAL -->
  <div id="welcome-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-greeting">Welcome! 🌸</h2>
      <p>Enter your name to start tracking:</p>
      <input id="user-name" type="text" placeholder="Your name" />
      <div class="modal-actions">
        <button id="start-btn" class="btn primary">Start Tracking</button>
        <button id="cancel-name" class="btn ghost">Cancel</button>
      </div>
    </div>
  </div>

  <!-- TOP BAR -->
  <header class="topbar">
    <h1 id="greeting">💫 Smart Expense Tracker</h1>
    <div class="controls">
      <select id="theme-select" aria-label="Select theme">
        <option value="theme-sunset">🌅 Sunset Glow</option>
        <option value="theme-stars">🌌 Starry Night</option>
        <option value="theme-ocean">🌊 Ocean Breeze</option>
        <option value="theme-candy">🍭 Candy Vibes</option>
      </select>
      <button id="edit-name" class="btn small">✏️ Change Name</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <!-- Add Expense -->
    <form id="expense-form" class="card">
      <h2>Add Transaction</h2>
      <input id="name" type="text" placeholder="Description (e.g., Pizza)" required />
      <input id="amount" type="number" placeholder="Amount (₹)" required />
      <select id="category">
        <option value="Food">🍕 Food</option>
        <option value="Travel">🚗 Travel</option>
        <option value="Entertainment">🎬 Entertainment</option>
        <option value="Shopping">🛍️ Shopping</option>
        <option value="Others">🧾 Others</option>
      </select>
      <div class="row">
        <button type="submit" class="btn primary">➕ Add</button>
        <button id="clear-btn" type="button" class="btn ghost">🧹 Clear All</button>
      </div>
    </form>

    <!-- Summary -->
    <section class="card summary">
      <div class="balance">
        <h3>Total Balance</h3>
        <div id="total" class="big">₹0.00</div>
        <p id="insight" class="insight">Start adding expenses!</p>
      </div>
      <div class="goal">
        <h3>Monthly Goal</h3>
        <input id="goal-input" type="number" placeholder="Set goal amount (₹)" />
        <div class="progress-wrap"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="goal-text" class="goal-text">Goal not set</div>
      </div>
    </section>

    <!-- Transactions -->
    <section class="card">
      <h3>Transactions</h3>
      <ul id="expense-list" class="expense-list"></ul>
    </section>

    <!-- Chart -->
    <section class="card">
      <h3>Expense Breakdown</h3>
      <div class="chart-wrap">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>
  </main>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
